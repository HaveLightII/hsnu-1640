[package]
name = "hsnu1640"
version = "0.1.1"
description = "Class announcements Android application"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hsnu1640_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
